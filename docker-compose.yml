services:
  app:
    image: ghcr.io/irsyamokta/sigap:latest
    build:
      context: .
      args:
        - GEMINI_API_KEY=${GEMINI_API_KEY}
        - BASE_URL=${BASE_URL}
        - CLIENT_ID=${CLIENT_ID}
        - CLIENT_SECRET=${CLIENT_SECRET}
    container_name: sigap
    restart: unless-stopped
    ports:
      - "3006:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      BASE_URL: ${BASE_URL}
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - odoonet

networks:
  odoonet:
    external: true
